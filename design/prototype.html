<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SplitPipe Prototype</title>
<style>
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --stage:#d9dbe1;
}
@media (prefers-color-scheme:dark){:root{--stage:#0e0f12}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--stage);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select{font:inherit;color:inherit}
#app{display:flex;height:100vh;gap:16px;padding:12px;align-items:flex-start}
#stagewrap{flex:1;min-width:0;display:flex;justify-content:center;align-items:flex-start;height:100%}
#screenbox{position:relative}

/* ---------- macOS screen ---------- */
.screen{
  --text:#1d1d1f;--text2:#6e6e73;--text3:#a1a1a6;--sep:rgba(0,0,0,.09);--sep2:rgba(0,0,0,.05);
  --win:#ffffff;--content:#ffffff;--side:rgba(232,232,237,.82);--group:#f5f5f7;--groupb:rgba(0,0,0,.06);
  --ctl:#ffffff;--ctlb:rgba(0,0,0,.14);--hover:rgba(0,0,0,.045);--sel:rgba(0,122,255,.12);--selsolid:#dbe8fb;
  --accent:#007aff;--menu:rgba(244,244,246,.9);--bar:rgba(246,246,248,.62);--bartext:#1d1d1f;
  --shadow:0 22px 70px rgba(0,0,0,.28),0 0 0 .5px rgba(0,0,0,.22);
  --c-direct:#1f9d55;--c-default:#8a8a8f;--c-block:#e5484d;--c-warn:#e08600;--c-ok:#1f9d55;
  --desk:radial-gradient(1200px 700px at 15% 10%,#9bb7e6 0,transparent 60%),radial-gradient(900px 600px at 85% 80%,#c9a4d9 0,transparent 60%),linear-gradient(160deg,#7d95c9,#b39cc8 55%,#e2b9b0);
  position:absolute;top:0;left:0;width:1280px;height:800px;transform-origin:0 0;overflow:hidden;border-radius:14px;
  background:var(--desk);color:var(--text);font-size:13px;line-height:1.35;user-select:none;
  box-shadow:0 10px 40px rgba(0,0,0,.25);
}
.screen.dark{
  --text:#f2f2f4;--text2:#a1a1a6;--text3:#6b6b70;--sep:rgba(255,255,255,.09);--sep2:rgba(255,255,255,.05);
  --win:#1f1f22;--content:#1f1f22;--side:rgba(44,44,48,.8);--group:#2a2a2d;--groupb:rgba(255,255,255,.07);
  --ctl:#3a3a3e;--ctlb:rgba(255,255,255,.12);--hover:rgba(255,255,255,.06);--sel:rgba(10,132,255,.22);--selsolid:#24364f;
  --accent:#0a84ff;--menu:rgba(42,42,46,.92);--bar:rgba(30,30,34,.55);--bartext:#f2f2f4;
  --shadow:0 22px 70px rgba(0,0,0,.6),0 0 0 .5px rgba(255,255,255,.14);
  --c-direct:#32c766;--c-default:#98989d;--c-block:#ff6369;--c-warn:#ffb340;--c-ok:#32c766;
  --desk:radial-gradient(1200px 700px at 15% 10%,#2b3a63 0,transparent 60%),radial-gradient(900px 600px at 85% 80%,#4a2f5c 0,transparent 60%),linear-gradient(160deg,#141a2e,#2a2040 55%,#3a2430);
}
.mono{font-family:var(--mono);font-size:11.5px}
.dim{color:var(--text2)}
.dim3{color:var(--text3)}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
svg.i.s{width:13px;height:13px}
svg.i.l{width:20px;height:20px}

/* menu bar */
.menubar{position:absolute;top:0;left:0;right:0;height:26px;background:var(--bar);backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6);display:flex;align-items:center;padding:0 10px;color:var(--bartext);font-size:13px;z-index:50}
.menubar .mitem{padding:2px 9px;border-radius:5px}
.menubar .mitem.b{font-weight:600}
.menubar .right{margin-left:auto;display:flex;align-items:center;gap:2px}
.menubar .ico{display:flex;align-items:center;justify-content:center;height:22px;min-width:28px;padding:0 6px;border-radius:5px;position:relative}
.menubar .ico.on,.menubar .ico:hover{background:rgba(127,127,127,.22)}
.menubar .clock{padding:0 8px;font-variant-numeric:tabular-nums}
.mbdot{position:absolute;right:3px;top:3px;width:6px;height:6px;border-radius:50%}

/* windows */
.win{position:absolute;background:var(--win);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.lights{display:flex;gap:8px;padding:0 4px}
.lights span{width:12px;height:12px;border-radius:50%;background:#ff5f57;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.18);cursor:default}
.lights span:nth-child(2){background:#febc2e}
.lights span:nth-child(3){background:#28c840}
.lights.off span{background:var(--text3);opacity:.45}

/* main window */
#mainwin{width:1010px;height:640px}
.mw{display:flex;height:100%}
.sidebar{width:208px;flex:none;background:var(--side);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);border-right:.5px solid var(--sep);display:flex;flex-direction:column}
.sidebar .top{height:52px;display:flex;align-items:center;padding:0 14px;flex:none}
.navsec{padding:6px 10px;color:var(--text3);font-size:11px;font-weight:600}
.nav{margin:0 8px;padding:5px 8px;border-radius:6px;display:flex;align-items:center;gap:8px;cursor:default;color:var(--text)}
.nav svg{color:var(--accent)}
.nav:hover{background:var(--hover)}
.nav.on{background:var(--sel)}
.nav .badge{margin-left:auto;font-size:11px;color:var(--text2);font-variant-numeric:tabular-nums}
.nav .badge.warn{color:var(--c-warn)}
.nav .badge.dot{width:7px;height:7px;border-radius:50%;background:var(--c-warn)}
.sidefoot{margin-top:auto;padding:12px;border-top:.5px solid var(--sep)}
.stcard{display:flex;align-items:center;gap:10px}
.stcard .big{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.stcard .t{font-weight:600}
.stcard .s{font-size:11px;color:var(--text2)}
.content{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--content)}
.toolbar{height:52px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px 0 18px;border-bottom:.5px solid var(--sep)}
.toolbar h1{font-size:15px;font-weight:650;margin:0}
.toolbar .sub{font-size:11px;color:var(--text2)}
.toolbar .sp{flex:1}
.body{flex:1;overflow:auto;min-height:0}
.split{display:flex;flex:1;min-height:0}
.inspector{width:292px;flex:none;border-left:.5px solid var(--sep);overflow:auto;background:var(--content)}

/* controls */
.btn{color:var(--text);border:.5px solid var(--ctlb);background:var(--ctl);border-radius:6px;padding:3px 10px;font-size:12.5px;box-shadow:0 .5px 1.5px rgba(0,0,0,.08);cursor:default;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:color-mix(in srgb,var(--ctl) 92%,var(--text))}
.btn:active{filter:brightness(.92)}
.screen.dark .btn:not(.primary):not(.dangerfill):not(.ghost){background:#4a4a50;border-color:rgba(255,255,255,.16);box-shadow:0 1px 2px rgba(0,0,0,.35),inset 0 .5px 0 rgba(255,255,255,.08)}
.screen.dark .btn:not(.primary):not(.dangerfill):not(.ghost):hover{background:#58585f}
.btn.primary:hover{filter:brightness(1.08)}
.btn[disabled]:hover{background:var(--ctl);filter:none}
.btn.primary{background:var(--accent);color:#fff;border-color:transparent}
.btn.danger{color:var(--c-block)}
.btn.dangerfill{background:var(--c-block);color:#fff;border-color:transparent}
.btn.big{padding:6px 16px;font-size:13px;border-radius:7px}
.btn[disabled]{opacity:.5}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--accent);padding:3px 6px}
.iconbtn{border:none;background:transparent;border-radius:6px;padding:4px 6px;color:var(--text2);display:inline-flex;align-items:center;cursor:default}
.iconbtn:hover{background:var(--hover)}
.iconbtn.on{color:var(--accent);background:var(--sel)}
.search{display:flex;align-items:center;gap:6px;background:var(--hover);border-radius:7px;padding:4px 8px;width:190px;color:var(--text2)}
.search input{border:none;background:transparent;outline:none;width:100%;font-size:12.5px;color:var(--text)}
.seg{display:inline-flex;background:var(--hover);border-radius:7px;padding:2px;gap:2px}
.seg button{border:none;background:transparent;border-radius:5px;padding:2px 10px;font-size:12px;cursor:default;white-space:nowrap}
.seg button.on{background:var(--ctl);box-shadow:0 .5px 2px rgba(0,0,0,.15)}
.toggle{width:32px;height:19px;border-radius:10px;background:rgba(120,120,128,.32);position:relative;flex:none;cursor:default;border:none;padding:0;transition:background .15s}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:left .15s}
.toggle.on{background:#34c759}
.toggle.on::after{left:15px}
.toggle.sm{width:26px;height:15px}
.toggle.sm::after{width:11px;height:11px}
.toggle.sm.on::after{left:13px}
.popup{display:inline-flex;align-items:center;gap:6px;border:.5px solid var(--ctlb);background:var(--ctl);border-radius:6px;padding:3px 6px 3px 8px;font-size:12.5px;box-shadow:0 .5px 1.5px rgba(0,0,0,.08);cursor:default;min-width:0;max-width:100%}
.popup .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.popup .chev{margin-left:auto;color:var(--text2);padding-left:4px}
.popup.wide{width:200px}
.popup.full{width:100%}
.popup.cmp{padding:2px 4px 2px 6px;font-size:12px}
.popup.cmp.wide{width:168px}
.popup.na .rico{color:var(--text3)!important}
.textin{border:.5px solid var(--ctlb);background:var(--ctl);border-radius:6px;padding:3px 8px;font-size:12.5px;outline:none;width:240px}
.textin:focus{box-shadow:0 0 0 3px rgba(0,122,255,.3)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:1px 7px 1px 6px;border-radius:20px;white-space:nowrap;font-weight:500}
.pill .d{width:6px;height:6px;border-radius:50%;background:currentColor}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:550;padding:1px 7px;border-radius:5px;white-space:nowrap}

/* app rows */
.empty{margin:14px 18px 6px;padding:16px;border-radius:10px;background:var(--group);border:.5px solid var(--groupb);display:flex;gap:14px;align-items:center}
.empty .em{width:40px;height:40px;border-radius:10px;background:var(--sel);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.listhead{padding:10px 18px 4px;font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.03em}
.row{display:flex;align-items:center;gap:11px;padding:7px 14px 7px 18px;border-bottom:.5px solid var(--sep2);cursor:default}
.row:hover{background:var(--hover)}
.row.on{background:var(--sel)}
.appico{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;flex:none;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.15),0 1px 2px rgba(0,0,0,.12)}
.appico.s{width:20px;height:20px;border-radius:5px;font-size:10px}
.appico.xs{width:16px;height:16px;border-radius:4px;font-size:9px}
.appico.l{width:44px;height:44px;border-radius:11px;font-size:20px}
.row .nm{flex:1;min-width:0}
.row .nm .a{font-weight:550;display:flex;align-items:center;gap:6px}
.row .nm .b{font-size:11px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.run{width:6px;height:6px;border-radius:50%;background:var(--c-ok);display:inline-block}
.eff{font-size:11px;display:flex;align-items:center;gap:4px;margin-top:2px}

/* inspector */
.isec{padding:14px 16px;border-bottom:.5px solid var(--sep)}
.isec h3{margin:0 0 8px;font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.03em;font-weight:600}
.ihead{display:flex;gap:12px;align-items:center}
.ihead .n{font-size:15px;font-weight:650}
.radio{display:flex;gap:8px;align-items:flex-start;padding:5px 0;cursor:default}
.radio .rb{width:15px;height:15px;border-radius:50%;border:.5px solid var(--ctlb);background:var(--ctl);flex:none;margin-top:1px;box-shadow:0 .5px 1px rgba(0,0,0,.1);display:flex;align-items:center;justify-content:center}
.radio.on .rb{background:var(--accent);border-color:transparent}
.radio.on .rb::after{content:"";width:5px;height:5px;border-radius:50%;background:#fff}
.radio .hint{font-size:11px;color:var(--text2);margin-top:2px}
.radio.dis{opacity:.45}
.effbox{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:8px;background:var(--group);border:.5px solid var(--groupb)}
.miniconn{display:flex;gap:8px;align-items:center;font-size:11.5px;padding:3px 0}
.miniconn .mono{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* routes */
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 18px 8px}
.rcard{border-radius:11px;background:var(--group);border:.5px solid var(--groupb);padding:14px;display:flex;flex-direction:column;gap:10px}
.rcard.down{opacity:.92}
.rcard .hd{display:flex;align-items:center;gap:10px}
.rcard .ri{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.rcard .ti{font-weight:650;font-size:13.5px;flex:1;min-width:0}
.rcard .ti input{font-weight:650;font-size:13.5px;border:none;outline:none;background:var(--ctl);border-radius:4px;padding:0 4px;width:100%;box-shadow:0 0 0 2px var(--accent)}
.rcard .ti .rn{cursor:text;border-radius:4px;padding:0 2px;margin:0 -2px}
.rcard .ti .rn:hover{background:var(--hover)}
.kv{display:grid;grid-template-columns:96px 1fr;row-gap:4px;font-size:12px}
.kv .k{color:var(--text2)}
.rcard .ft{display:flex;align-items:center;gap:8px;border-top:.5px solid var(--sep);padding-top:10px;font-size:11.5px;color:var(--text2)}
.banner{margin:14px 18px 4px;border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:center;border:.5px solid}
.banner.ok{background:color-mix(in srgb,var(--c-ok) 9%,transparent);border-color:color-mix(in srgb,var(--c-ok) 30%,transparent)}
.banner.warn{background:color-mix(in srgb,var(--c-warn) 11%,transparent);border-color:color-mix(in srgb,var(--c-warn) 34%,transparent)}
.banner.bad{background:color-mix(in srgb,var(--c-block) 10%,transparent);border-color:color-mix(in srgb,var(--c-block) 32%,transparent)}
.banner .bt{flex:1;font-size:12.5px}
.banner .bt b{font-weight:600}
.banner .bt div{font-size:11.5px;color:var(--text2)}

/* connections table */
table.ct{width:100%;border-collapse:collapse;font-size:12px}
.ct th{position:sticky;top:0;background:var(--content);text-align:left;font-weight:500;color:var(--text2);font-size:11px;padding:6px 8px;border-bottom:.5px solid var(--sep);z-index:1}
.ct td{padding:5px 8px;border-bottom:.5px solid var(--sep2);white-space:nowrap}
.ct tr.ab td{opacity:.45}
.ct tr.ab .mono{text-decoration:line-through}
.ct tr.new td{animation:flash 1.2s ease-out}
@keyframes flash{from{background:var(--sel)}to{background:transparent}}
.ct .grp td{background:var(--group);font-weight:600;padding:6px 8px;cursor:default}
.ct td.num{text-align:right;font-variant-numeric:tabular-nums;color:var(--text2)}
.ct th:first-child,.ct td:first-child{padding-left:18px}

/* diagnostics */
.dlist{padding:6px 18px 18px}
.ditem{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:.5px solid var(--sep2)}
.ditem .st{width:20px;height:20px;flex:none;display:flex;align-items:center;justify-content:center;margin-top:1px}
.ditem .tx{flex:1}
.ditem .tx .t{font-weight:550}
.ditem .tx .d{font-size:12px;color:var(--text2)}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--sep);border-top-color:var(--accent);animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* onboarding */
.onb{flex:1;display:flex;align-items:center;justify-content:center;background:var(--content)}
.onbc{width:500px}
.onbc .logo{display:flex;justify-content:center;margin-bottom:12px}
.onbc h2{text-align:center;margin:0 0 4px;font-size:22px;font-weight:700}
.onbc .lead{text-align:center;color:var(--text2);margin:0 0 22px}
.prog{height:4px;border-radius:3px;background:var(--hover);margin:0 0 18px;overflow:hidden}
.prog div{height:100%;background:var(--accent);transition:width .3s}
.step{display:flex;gap:12px;padding:12px;border-radius:10px;margin-bottom:8px;border:.5px solid transparent}
.step.cur{background:var(--group);border-color:var(--groupb)}
.step .num{width:26px;height:26px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:650;font-size:12px;background:var(--hover);color:var(--text2)}
.step.done .num{background:var(--c-ok);color:#fff}
.step.err .num{background:var(--c-block);color:#fff}
.step.cur .num{background:var(--accent);color:#fff}
.step .st1{font-weight:600}
.step .st2{font-size:12px;color:var(--text2);margin-top:2px}
.step .act{margin-top:10px;display:flex;gap:8px;align-items:center}
.step .errm{font-size:12px;color:var(--c-block);margin-top:6px}

/* statistics */
.stiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:14px 18px 6px}
.stile{border-radius:11px;background:var(--group);border:.5px solid var(--groupb);padding:12px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.stile .k{font-size:11px;color:var(--text2);display:flex;align-items:center;gap:5px}
.stile .v{font-size:20px;font-weight:650;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.stile .s{font-size:11px;color:var(--text2);font-variant-numeric:tabular-nums}
.scard{margin:8px 18px 4px;border-radius:11px;background:var(--group);border:.5px solid var(--groupb);padding:14px}
.scard .hd{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.scard .hd b{font-size:13px;font-weight:650}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--text2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block}
.chart{width:100%;height:170px;display:block}
.chart .ax{fill:var(--text3);font-size:10px}
.chart .gl{stroke:var(--sep);stroke-width:.5}
.chart rect.b:hover{opacity:.75}
.sbar{height:6px;border-radius:3px;background:var(--hover);overflow:hidden;display:flex}
.sbar>div{height:100%}
.rrow{display:grid;grid-template-columns:24px 1fr 1.3fr 90px 70px;align-items:center;gap:10px;padding:7px 0;border-top:.5px solid var(--sep2);font-size:12.5px}
.rrow:first-of-type{border-top:none}
.rrow .num,.st .num{text-align:right;font-variant-numeric:tabular-nums}
.st{width:100%;border-collapse:collapse;font-size:12.5px}
.st th{font-weight:500;color:var(--text2);font-size:11px;text-align:left;padding:4px 6px;border-bottom:.5px solid var(--sep)}
.st td{padding:6px;border-bottom:.5px solid var(--sep2);vertical-align:middle}
.st tr:hover td{background:var(--hover)}
.st .share{display:flex;align-items:center;gap:8px}
.st .share .sbar{flex:1;min-width:60px}

/* popover */
.popover{position:absolute;top:31px;width:344px;background:var(--menu);backdrop-filter:blur(40px) saturate(1.8);-webkit-backdrop-filter:blur(40px) saturate(1.8);border-radius:12px;box-shadow:var(--shadow);z-index:60;padding:8px;font-size:12.5px}
.pv-head{display:flex;align-items:center;gap:10px;padding:6px 6px 10px}
.pv-head .t{font-weight:650;font-size:13.5px}
.pv-head .s{font-size:11.5px;color:var(--text2)}
.pv-sec{padding:6px 6px 2px;font-size:11px;font-weight:600;color:var(--text3)}
.pv-row{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:6px}
.pv-row .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv-fg{margin:2px 0 4px;padding:8px;border-radius:9px;background:var(--hover)}
.pv-fg .pv-row{padding:0}
.pv-ban{margin:4px 2px 6px;padding:7px 9px;border-radius:8px;font-size:11.5px;display:flex;gap:7px;align-items:flex-start}
.pv-ban.warn{background:color-mix(in srgb,var(--c-warn) 15%,transparent)}
.pv-ban.bad{background:color-mix(in srgb,var(--c-block) 14%,transparent)}
.pv-sep{height:.5px;background:var(--sep);margin:6px 4px}
.pv-item{padding:4px 8px;border-radius:5px;cursor:default;display:flex;justify-content:space-between}
.pv-item:hover{background:var(--accent);color:#fff}
.pv-item:hover .dim{color:rgba(255,255,255,.8)}
.ks{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:2px 8px;border-radius:20px;background:var(--hover);color:var(--text2);white-space:nowrap}
.ks.blk{background:color-mix(in srgb,var(--c-block) 16%,transparent);color:var(--c-block)}
.ks.arm{color:var(--text)}

.menu{position:absolute;z-index:200;min-width:220px;background:var(--menu);backdrop-filter:blur(40px) saturate(1.8);-webkit-backdrop-filter:blur(40px) saturate(1.8);border-radius:9px;box-shadow:0 10px 40px rgba(0,0,0,.25),0 0 0 .5px var(--ctlb);padding:5px;font-size:13px}
.menu .mh{padding:5px 10px 2px;font-size:11px;font-weight:600;color:var(--text3)}
.menu .ms{height:.5px;background:var(--sep);margin:5px 6px}
.menu .mi{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 6px;border-radius:5px;cursor:default;white-space:nowrap}
.menu .mi .ck{width:14px;display:flex;justify-content:center}
.menu .mi .sb{margin-left:auto;padding-left:14px;font-size:11.5px;color:var(--text3)}
.menu .mi.dimmed{color:var(--text3)}
.menu .mi:hover{background:var(--accent);color:#fff}
.menu .mi:hover .sb,.menu .mi:hover .rico{color:rgba(255,255,255,.85)!important}

/* settings */
#setwin{width:660px;height:560px}
.settb{display:flex;flex-direction:column;align-items:center;padding-top:10px;border-bottom:.5px solid var(--sep);background:var(--side);flex:none}
.settb .ttl{font-weight:600;font-size:13px;margin-bottom:6px}
.settb .tabs{display:flex;gap:2px;padding-bottom:6px}
.settb .tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 9px;border-radius:7px;font-size:11px;color:var(--text2);cursor:default;min-width:72px}
.settb .tab svg{width:22px;height:22px;color:var(--text2)}
.settb .tab.on{background:var(--hover);color:var(--accent)}
.settb .tab.on svg{color:var(--accent)}
.setbody{flex:1;overflow:auto;padding:18px 22px}
.fgroup{border-radius:9px;background:var(--group);border:.5px solid var(--groupb);margin-bottom:16px}
.fgroup .fh{font-size:12px;font-weight:600;padding:0 4px 6px;color:var(--text)}
.frow{display:flex;align-items:center;gap:12px;padding:9px 12px;border-bottom:.5px solid var(--sep)}
.frow:last-child{border-bottom:none}
.frow .fl{flex:1}
.frow .fl .h{font-size:11.5px;color:var(--text2);margin-top:2px}
.fnote{font-size:11.5px;color:var(--text2);padding:0 4px;margin:-8px 0 16px}
.hintbox{display:flex;gap:8px;padding:9px 12px;border-radius:9px;margin-bottom:16px;font-size:12px;background:var(--sel)}

#syswin{width:620px;height:430px}
.sysw{display:flex;height:100%}
.sysw .ss{width:190px;background:var(--side);border-right:.5px solid var(--sep);padding-top:44px}
.sysw .ss .it{margin:1px 8px;padding:4px 8px;border-radius:6px;display:flex;gap:8px;align-items:center;font-size:12.5px}
.sysw .ss .it .sq{width:18px;height:18px;border-radius:5px;flex:none}
.sysw .ss .it.on{background:var(--accent);color:#fff}
.sysw .sc{flex:1;padding:44px 20px 20px;overflow:auto}
.sysw .sc h2{font-size:15px;margin:0 0 14px}

.scrim{position:absolute;inset:0;background:rgba(0,0,0,.18);z-index:120;display:flex;align-items:center;justify-content:center}
.dialog{width:300px;background:var(--menu);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);border-radius:14px;box-shadow:var(--shadow);padding:20px 18px 16px;text-align:center}
.dialog h4{margin:10px 0 6px;font-size:13.5px}
.dialog p{margin:0 0 14px;font-size:11.5px;color:var(--text2)}
.dialog .db{display:flex;flex-direction:column;gap:6px}
.dialog .db .btn{justify-content:center;padding:5px 10px}

@keyframes nin{from{transform:translateX(30px);opacity:0}}
.notif .t{font-weight:600;font-size:12.5px}
.notif .b{font-size:12px;color:var(--text2)}
.toast{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);background:rgba(30,30,32,.9);color:#fff;padding:8px 14px;border-radius:9px;font-size:12.5px;z-index:150}

#sim .note{opacity:.7;margin:4px 0 10px;line-height:1.4}

  else { const inner = resolve(fb.slice(4), 'block', depth + 1); out = {...inner, fbUsed:'alt', unavail2: inner.unavail}; }
  out.unavail = id;
  return out;
}
function effective(app){
  if (!S.enabled || !S.ext || S.onboarding) {
    const d = defaultTarget();
    return {...d, unmanaged:true};
  }
  const rule = app.rule || {route:'default', fb:'default'};
  const res = resolve(rule.route, rule.fb, 0);
  if (res.via === 'default' && !res.block && S.routes[res.r]?.kind !== 'vpn' && ksOn()) return {...res, r:undefined, block:'ks'};
  return res;
}
function effText(res){
  if (res.block === 'rule') return 'Заблокировано правилом';
  if (res.block === 'nonet') return 'Нет сети';
  if (res.block === 'ks') return 'VPN недоступен, kill switch → заблокировано';
  if (res.block === 'unavail' && res.unavail2) return `${rName(res.unavail)} и запасной ${rName(res.unavail2)} недоступны → заблокировано`;
  if (res.block === 'unavail') return `${rName(res.unavail)} недоступен → заблокировано`;
  if (res.unavail) return `${rName(res.unavail)} недоступен → ${via(res.r)}`;
  if (res.via === 'default') return `сейчас ${via(res.r)}`;
  return via(res.r);
}
const via = id => id === 'direct' ? `напрямую через ${directInfo().label}` : `через ${rName(id)}`;
const effColor = res => res.block ? 'var(--c-block)' : res.unavail ? 'var(--c-warn)' : rColor(res.r);
const effRouteKey = res => res.block ? 'block' : res.r;
const ruleRoute = app => app.rule ? app.rule.route : 'default';
const fbDefault = route => (route === 'direct' ? S.settings.fbDirect : S.settings.fbVpn);

function appState(){
  if (!S.enabled || !S.ext || S.onboarding) return 'off';
  const running = APPS.filter(a => a.running);
  if (running.some(a => effective(a).block === 'ks')) return 'ks';
  if (running.some(a => a.rule && effective(a).unavail)) return 'warn';
  return 'ok';
}
function ksState(){
  if (!ksOn()) return 'off';
  if (S.enabled && S.ext && !routeUp(S.routes.amnezia) && physUp()) return 'blocks';
  return 'armed';
}
const ksLabel = () => ({off:'Kill switch выкл', armed:'Kill switch ждёт', blocks:'Kill switch блокирует'})[ksState()];

/* ============================== connections ============================== */
let connSeq = 1;
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a));
function spawnConn(app){
  const res = effective(app);
  const [dst, host] = app.hosts[rnd(0, app.hosts.length)];
  const udp = (app.id === 'telegram' || app.id === 'opera' || app.id === 'zoom') && Math.random() < .25;
  const c = {id:connSeq++, t:new Date(), app:app.id, dst, host, proto: udp ? 'UDP' : 'TCP',
    route: effRouteKey(res), routeLabel: res.block ? 'Заблокировано' : rName(res.r),
    state: res.block ? 'blocked' : 'active', bytes: res.block ? 0 : rnd(600, 9000), fresh:true, life: rnd(4, 26)};
  S.conns.unshift(c);
  if (S.conns.length > 260) S.conns.length = 260;
}
function abortConns(pred){
  let n = 0;
  S.conns.forEach(c => { if (c.state === 'active' && pred(c)) { c.state = 'aborted'; n++; } });
  return n;
}
function refreshApp(appId){
  const app = appById(appId);
  if (S.settings.abortOnChange) abortConns(c => c.app === appId);
  if (app.running) { spawnConn(app); spawnConn(app); }
}
function tick(){
  if (S.paused) return;
  S.conns.forEach(c => {
    c.fresh = false;
    if (c.state === 'active') { c.bytes += rnd(200, 14000); if (--c.life <= 0) c.state = 'closed'; }
  });
  const running = APPS.filter(a => a.running);
  const n = Math.random() < .4 ? 2 : 1;
  for (let i = 0; i < n; i++) spawnConn(running[rnd(0, running.length)]);
  renderLive();
}
function fmtBytes(b){
  if (!b) return '—';
  if (b < 1024) return b + ' Б';
  if (b < 1048576) return (b / 1024).toFixed(1) + ' КБ';
  return (b / 1048576).toFixed(1) + ' МБ';
}
const fmtTime = d => d.toTimeString().slice(0, 8);

/* ---------- routes ---------- */

  let foot = `${users.length} ${plural(users.length, 'приложение', 'приложения', 'приложений')}`;
  if (!up && users.length) {

    <div class="ft"><span style="flex:1">${foot}</span>
      <div style="display:flex">${users.slice(0, 5).map(a => `<span style="margin-left:-4px" title="${esc(a.name)}">${appIco(a,'xs')}</span>`).join('')}</div>
      <button class="btn" data-act="check" data-r="${id}" title="Отправить запрос через этот маршрут: узнать внешний IP и задержку" ${chk?.state === 'run' ? 'disabled' : ''}>${chk?.state === 'run' ? '<span class="spin" style="width:11px;height:11px"></span>' : ic('refresh','s')} Проверить связь</button></div>
  </div>`;
}
function checkStatus(id, chk){
  const iface = id === 'direct' ? directInfo().iface : S.routes[id].iface;
  if (chk?.state === 'run') return `<span class="spin" style="width:11px;height:11px"></span><span class="dim">запрос через ${iface}…</span>`;
  if (chk?.state === 'ok') return `<span style="color:var(--c-ok);display:flex">${ic('check','s','stroke-width:2.2')}</span><span>работает · ${chk.ms} мс</span><span class="dim3">· ${ago(chk.at)}</span>`;

  return `<span class="dim3">не проверялось</span>`;
}
const ago = t => { const s = Math.round((Date.now() - t) / 1000); return s < 10 ? 'только что' : s < 60 ? `${s} с назад` : `${Math.round(s / 60)} мин назад`; };
const plural = (n, a, b, c) => { const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20) ? b : c; };
function renderRoutes(){
  return `<div class="toolbar" data-drag="main"><div><h1>Маршруты</h1><div class="sub">Куда может идти трафик приложений</div></div><div class="sp"></div>

    <div class="body">${topBanners()}

/* ---------- connections ---------- */
function connRows(){
  let cs = S.conns;
  if (S.connFilter === 'blocked') cs = cs.filter(c => c.route === 'block');
  else if (S.connFilter !== 'all') cs = cs.filter(c => c.route === S.connFilter);
  cs = cs.slice(0, 120);
  const row = c => {
    const a = appById(c.app);
    return `<tr class="${c.state === 'aborted' ? 'ab' : ''}${c.fresh ? ' new' : ''}"><td class="mono dim">${fmtTime(c.t)}</td>
      <td><span style="display:inline-flex;gap:6px;align-items:center">${appIco(a,'xs')}${esc(a.name)}</span></td>
      <td><span class="mono">${esc(c.dst)}</span> <span class="dim3" style="font-size:11px">${esc(c.host)}</span></td>
      <td class="dim">${c.proto}</td><td>${routeTag(c)}</td>
      <td class="num">${c.state === 'blocked' ? '—' : fmtBytes(c.bytes)}${c.state === 'active' ? ' <span style="color:var(--c-ok)">●</span>' : ''}</td></tr>`;
  };
  if (!cs.length) return `<tr><td colspan="6" class="dim" style="text-align:center;padding:40px">Нет соединений</td></tr>`;
  if (!S.grouped) return cs.map(row).join('');
  const groups = {};
  cs.forEach(c => (groups[c.app] = groups[c.app] || []).push(c));
  return Object.entries(groups).map(([id, list]) => {
    const a = appById(id), col = S.collapsed[id];
    const total = list.reduce((s, c) => s + c.bytes, 0), act = list.filter(c => c.state === 'active').length;
    return `<tr class="grp" data-act="collapse" data-app="${id}"><td colspan="6"><span style="display:inline-flex;gap:8px;align-items:center">
      <span style="display:inline-block;transform:rotate(${col ? 0 : 90}deg);transition:transform .15s">›</span>${appIco(a,'xs')}${esc(a.name)}
      <span class="dim" style="font-weight:400">${list.length} · активных ${act} · ${fmtBytes(total)}</span></span>
      <button class="btn" style="float:right;padding:1px 8px;font-size:11.5px" data-act="abort-app" data-app="${id}">Оборвать</button></td></tr>` + (col ? '' : list.map(row).join(''));
  }).join('');
}
function renderConns(){
  const opts = [['all','Все маршруты'],['direct','Напрямую'],...S.vpnOrder.map(id => [id, S.routes[id].name]),['block','Заблокированные']];

      <button class="popup" data-act="conn-filter"><span class="lbl">${esc(cur[1])}</span><span class="chev">${ic('chev','s')}</span></button>

      <button class="iconbtn${S.paused ? ' on' : ''}" data-act="pause" title="${S.paused ? 'Продолжить' : 'Пауза'}">${ic(S.paused ? 'play' : 'pause')}</button></div>
    <div class="body">${topBanners()}<table class="ct"><thead><tr><th style="width:70px">Время</th><th style="width:150px">Приложение</th><th>Адрес</th><th style="width:44px">Прот.</th><th style="width:150px">Маршрут</th><th style="width:84px;text-align:right">Трафик</th></tr></thead>
      <tbody id="conn-body">${connRows()}</tbody></table></div>`;

/* ---------- statistics ---------- */
/* Те же данные, что будет собирать расширение: по интервалам времени, приложениям и маршрутам — ↓/↑ байты,
   число соединений и заблокированных. «По умолчанию» учитывается по фактическому маршруту (обычно VPN). */
const STAT_PERIODS = [['hour','Час'],['today','Сегодня'],['week','7 дней'],['month','30 дней']];
function statSeed(n){ let x = Math.sin(n * 12.9898) * 43758.5453; return x - Math.floor(x); }
function statsData(){
  const p = S.statsPeriod;
  const now = new Date();
  const buckets = p === 'hour' ? 12 : p === 'today' ? now.getHours() + 1 : p === 'week' ? 7 : 30;
  const scale = p === 'hour' ? 0.08 : p === 'today' ? 1 : p === 'week' ? 7.5 : 26;
  const label = i => p === 'hour' ? `${String(Math.floor(i * 5)).padStart(2,'0')}'` : p === 'today' ? `${i}:00`
    : (() => { const d = new Date(now); d.setDate(d.getDate() - (buckets - 1 - i)); return `${d.getDate()}.${String(d.getMonth() + 1).padStart(2,'0')}`; })();
  const effRoute = a => { const r = a.rule ? a.rule.route : 'default'; return r === 'default' ? 'amnezia' : r; };
  const weight = {opera:9, telegram:3.2, safari:4.1, slack:1.6, jira:0.9, spotify:5.5, zoom:2.4, mail:0.5, chrome:3.8, notion:0.7};
  const rows = [];
  APPS.forEach((a, ai) => {
    const w = weight[a.id] ?? 0.4 + statSeed(ai) * 1.2;
    const route = effRoute(a);
    if (route === 'block') { rows.push({app:a.id, route:'block', bucket:buckets - 1, down:0, up:0, flows:0, blocked:Math.round(40 * scale * statSeed(ai + 7))}); return; }
    for (let i = 0; i < buckets; i++) {
      const hour = p === 'today' ? i : 12;
      const day = p === 'today' || p === 'hour' ? (hour >= 9 && hour <= 23 ? 1 : 0.15) : 1;
      const k = w * day * (0.4 + statSeed(ai * 97 + i)) * (p === 'hour' ? 1 : 1) * 1048576 * 6 * (p === 'week' || p === 'month' ? 14 : 1) * (p === 'hour' ? 0.12 : 1);
      // Часть трафика ушла по запасному маршруту, пока основной был недоступен.
      const r = route === 'work' && statSeed(ai + i) > 0.85 ? 'amnezia' : route;
      rows.push({app:a.id, route:r, bucket:i, down:k, up:k * (0.06 + statSeed(ai + i * 3) * 0.12),
        flows:Math.round((4 + 30 * statSeed(ai * 13 + i)) * w), blocked: a.rule && a.rule.fb === 'block' && statSeed(ai * 5 + i) > 0.9 ? Math.round(3 + 10 * statSeed(i)) : 0});
    }
  });
  return {buckets, label, rows};
}
function renderStats(){
  const {buckets, label, rows} = statsData();
  const sum = (list, f) => list.reduce((s, x) => s + f(x), 0);
  const total = sum(rows, r => r.down + r.up), down = sum(rows, r => r.down), up = sum(rows, r => r.up);
  const flows = sum(rows, r => r.flows), blocked = sum(rows, r => r.blocked);
  const routeIds = ['direct', ...S.vpnOrder].filter(id => rows.some(r => r.route === id));
  const byRoute = Object.fromEntries(routeIds.map(id => [id, rows.filter(r => r.route === id)]));
  const rTotal = id => sum(byRoute[id], r => r.down + r.up);
  const vpnTotal = sum(S.vpnOrder.filter(id => byRoute[id]), rTotal);
  const pct = x => total ? Math.round(x / total * 100) + '%' : '—';
  const fmt = b => b >= 1073741824 ? (b / 1073741824).toFixed(1) + ' ГБ' : fmtBytes(Math.round(b));
  // график: столбики по интервалам, сложенные по маршрутам
  const per = Array.from({length: buckets}, (_, i) => routeIds.map(id => sum(byRoute[id].filter(r => r.bucket === i), r => r.down + r.up)));
  const max = Math.max(1, ...per.map(v => v.reduce((a, b) => a + b, 0)));
  const W = 760, Hh = 170, padL = 44, padB = 18, cw = (W - padL) / buckets, bw = Math.max(3, cw * 0.62);
  const grid = [0, .5, 1].map(f => { const y = (Hh - padB) * (1 - f) + .5; return `<line class="gl" x1="${padL}" x2="${W}" y1="${y}" y2="${y}"/><text class="ax" x="${padL - 6}" y="${y + 3}" text-anchor="end">${f ? fmt(max * f) : '0'}</text>`; }).join('');
  const bars = per.map((vals, i) => { let y = Hh - padB; return vals.map((v, j) => { const h = v / max * (Hh - padB - 6); y -= h;
      return h > 0 ? `<rect class="b" x="${padL + i * cw + (cw - bw) / 2}" y="${y}" width="${bw}" height="${h}" rx="1.5" fill="${rColor(routeIds[j])}"><title>${esc(label(i))} · ${esc(rName(routeIds[j]))}: ${fmt(v)}</title></rect>` : ''; }).join(''); }).join('');
  const step = Math.ceil(buckets / 8);
  const xl = Array.from({length: buckets}, (_, i) => i % step === 0 ? `<text class="ax" x="${padL + i * cw + cw / 2}" y="${Hh - 4}" text-anchor="middle">${esc(label(i))}</text>` : '').join('');
  // приложения
  const apps = APPS.map(a => { const rs = rows.filter(r => r.app === a.id);
    return {a, total: sum(rs, r => r.down + r.up), down: sum(rs, r => r.down), up: sum(rs, r => r.up), flows: sum(rs, r => r.flows), blocked: sum(rs, r => r.blocked),
      routes: routeIds.map(id => [id, sum(rs.filter(r => r.route === id), r => r.down + r.up)]).filter(x => x[1] > 0)}; })
    .filter(x => x.total > 0 || x.blocked > 0).sort((x, y) => y.total - x.total);
  const top = apps[0]?.total || 1;
  const tile = (icon, k, v, sub, col='') => `<div class="stile"><div class="k">${ic(icon,'s', col ? `color:${col}` : '')}${k}</div><div class="v">${v}</div><div class="s">${sub}</div></div>`;
  const per1 = {hour:'за последний час', today:'за сегодня', week:'за 7 дней', month:'за 30 дней'}[S.statsPeriod];
  return `<div class="toolbar" data-drag="main"><div><h1>Статистика</h1><div class="sub">Трафик через SplitPipe ${per1}</div></div><div class="sp"></div>
      <div class="seg">${STAT_PERIODS.map(([id, t]) => `<button class="${S.statsPeriod === id ? 'on' : ''}" data-act="stats-period" data-p="${id}">${t}</button>`).join('')}</div></div>
    <div class="body">
      <div class="stiles">
        ${tile('routes', 'Весь трафик', fmt(total), `↓ ${fmt(down)} · ↑ ${fmt(up)}`)}
        ${tile(directInfo().icon, 'Напрямую', pct(byRoute.direct ? rTotal('direct') : 0), fmt(byRoute.direct ? rTotal('direct') : 0), 'var(--c-direct)')}
        ${tile('shield', 'Через VPN', pct(vpnTotal), fmt(vpnTotal), S.routes.amnezia.color)}
        ${tile('list', 'Соединений', flows.toLocaleString('ru-RU'), blocked ? `<span style="color:var(--c-block)">заблокировано ${blocked}</span>` : 'без блокировок')}
      </div>
      <div class="scard"><div class="hd"><b>Трафик по маршрутам</b><div class="sp" style="flex:1"></div>
        <div class="legend">${routeIds.map(id => `<span><i style="background:${rColor(id)}"></i>${esc(rName(id))}</span>`).join('')}</div></div>
        <svg class="chart" viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="none">${grid}${bars}${xl}</svg></div>
      <div class="scard"><div class="hd"><b>Маршруты</b></div>
        ${routeIds.map(id => { const rs = byRoute[id], t = rTotal(id);
          return `<div class="rrow">${ic(rIcon(id),'', `color:${rColor(id)}`)}<span>${esc(rName(id))}</span>
            <div class="sbar"><div style="width:${t / total * 100}%;background:${rColor(id)}"></div></div>
            <span class="num">${fmt(t)} <span class="dim3">${pct(t)}</span></span><span class="num dim">${sum(rs, r => r.flows)} соед.</span></div>`; }).join('')}
      </div>
      <div class="scard"><div class="hd"><b>Приложения</b><span class="dim" style="font-size:11.5px">по трафику ${per1}</span></div>
        <table class="st"><thead><tr><th>Приложение</th><th style="width:170px">Маршруты</th><th style="width:220px">Трафик</th><th style="width:70px;text-align:right">↓ / ↑</th><th style="width:64px;text-align:right">Соед.</th><th style="width:74px;text-align:right">Заблок.</th></tr></thead>
        <tbody>${apps.map(x => `<tr><td><span style="display:inline-flex;gap:8px;align-items:center">${appIco(x.a,'xs')}${esc(x.a.name)}</span></td>
          <td>${x.routes.length ? x.routes.map(([id]) => `<span class="tag" style="background:color-mix(in srgb,${rColor(id)} 15%,transparent);color:${rColor(id)};margin-right:4px">${esc(rName(id))}</span>`).join('') : `<span class="tag" style="background:color-mix(in srgb,var(--c-block) 15%,transparent);color:var(--c-block)">${ic('block','s')}Блокировать</span>`}</td>
          <td><div class="share"><div class="sbar">${x.routes.map(([id, v]) => `<div style="width:${v / top * 100}%;background:${rColor(id)}"></div>`).join('')}</div><span class="num" style="min-width:62px">${x.total ? fmt(x.total) : '—'}</span></div></td>
          <td class="num dim" style="font-size:11px">${x.total ? `${Math.round(x.down / x.total * 100)}/${Math.round(x.up / x.total * 100)}%` : '—'}</td>

function runDiag(){

    <h5>Система</h5>
    <div class="sr"><span>Расширение разрешено</span>${sw(S.ext, 'ext')}</div>
    <div class="sr"><span>На переднем плане</span><select data-sim-sel="fg">${running.map(a => `<option value="${a.id}"${a.id === S.foreground ? ' selected' : ''}>${esc(a.name)}</option>`).join('')}</select></div>
    <div class="sr"><span>Тема</span><div class="sg">${sw(S.theme === 'light', 'theme:light', 'светлая', 'светлая')}${sw(S.theme === 'dark', 'theme:dark', 'тёмная', 'тёмная')}</div></div>
    <h5>Онбординг</h5>
    <button class="act" data-sim="onb">▶ Первый запуск</button>
    <div class="sr"><span>Ошибка на шаге</span><select data-sim-sel="err">${[0,1,2,3].map(n => `<option value="${n}"${S.onbErrStep === n ? ' selected' : ''}>${n ? n : 'нет'}</option>`).join('')}</select></div>
    <h5>Данные</h5>
    <button class="act" data-sim="reset">⟲ Сбросить правила</button>
    <button class="act" data-sim="restore">↺ Вернуть исходное состояние</button>
    <h5>Сценарии</h5>
    <div class="scn">1. «Первый запуск» → 3 шага → список.</div>
    <div class="scn">2. Opera: «По умолчанию» → «Напрямую» — смотри «Соединения».</div>
    <div class="scn">3. Откл. WireGuard «Work»: Slack блок, Jira → запасной OpenVPN (тоже откл. → блок).</div>
    <div class="scn">4. Настройки → Kill switch «Всегда», откл. Amnezia: Safari/Xcode блок, Opera/Telegram работают.</div>
    <div class="scn">5. Значок в строке меню → маршрут активного приложения.</div>
    <div class="scn">6. Диагностика → DNS → «Исправить».</div>
  </div>`;
}

/* ============================== render root ============================== */
function render(){
  const scr = document.getElementById('screen');
  scr.classList.toggle('dark', S.theme === 'dark');
  const qFocused = document.activeElement?.id === 'q';
  const qPos = qFocused ? document.activeElement.selectionStart : 0;
  closeMenu();
  scr.innerHTML = renderMenubar() + renderMain() + renderSettings() + renderSys() + renderPopover() + renderAlert() + renderNotif() + (S.toast ? `<div class="toast">${esc(S.toast)}</div>` : '');
  if (qFocused) { const q = document.getElementById('q'); q.focus(); q.setSelectionRange(qPos, qPos); }
  const rn = document.getElementById('rename');
  if (rn) { rn.focus(); rn.select(); }
  renderSim();
}
function renderLive(){
  if (!S.mainOpen || S.onboarding) return;
  const b = document.getElementById('badge-conns');
  const active = S.conns.filter(c => c.state === 'active').length;
  if (b) b.textContent = active;
  if (S.view === 'conns') {
    const body = document.getElementById('conn-body'); if (body) body.innerHTML = connRows();
    const sub = document.getElementById('conn-sub'); if (sub) sub.textContent = active + ' активных';
  }
  const ic2 = document.getElementById('insp-conns');
  if (ic2 && S.view === 'apps') ic2.innerHTML = inspConns(appById(S.selected));
}
function fit(){
  const wrap = document.getElementById('stagewrap'), box = document.getElementById('screenbox'), scr = document.getElementById('screen');
  const k = Math.min(wrap.clientWidth / 1280, wrap.clientHeight / 800, 1.25);
  scr.style.transform = `scale(${k})`;
  box.style.width = 1280 * k + 'px'; box.style.height = 800 * k + 'px';
}

/* ============================== actions ============================== */
function setRoute(appId, key){
  const a = appById(appId);
  const prev = ruleRoute(a);
  if (!a.rule) a.rule = {route:key, fb:fbDefault(key)};
  else {
    const oldDef = fbDefault(a.rule.route);
    a.rule.route = key;
    if (a.rule.fb === oldDef || (a.rule.fb.startsWith('alt:') && a.rule.fb.slice(4) === key)) a.rule.fb = fbDefault(key);
  }
  if (prev !== key) refreshApp(appId);
  render();
}
function setVpn(id, up){
  const r = S.routes[id];
  if (r.up === up) return;
  r.up = up;
  if (!up) {
    abortConns(c => c.route === id);
    const affected = APPS.filter(a => a.rule && a.rule.route === id);
    const blocked = affected.filter(a => effective(a).block);
    notify(`${r.name} отключился`, blocked.length ? `Заблокировано: ${blocked.map(a => a.name).join(', ')}` : affected.length ? `${affected.map(a => a.name).join(', ')} → запасной маршрут` : 'Приложения не затронуты');
    if (id === 'amnezia' && ksOn()) setTimeout(() => notify('Kill switch сработал', 'Трафик без VPN заблокирован. «Напрямую» продолжают работать.'), 900);
  } else {
    APPS.filter(a => a.rule && a.rule.route === id).forEach(a => abortConns(c => c.app === a.id));
    notify(`${r.name} подключён`, 'Правила снова применяются');
  }
  APPS.filter(a => a.running).forEach(spawnConn);
  render();
}

const scr = () => document.getElementById('screen');
document.addEventListener('mousedown', e => {
  if (menuCtx && !menuCtx.el.contains(e.target) && !menuCtx.anchor.contains(e.target)) closeMenu();
  if (S.popover && !e.target.closest('.popover') && !e.target.closest('[data-act="popover"]') && !e.target.closest('.menu') && scr().contains(e.target)) {
    S.popover = false;
    document.querySelector('.popover')?.remove();
    document.querySelector('.menubar .ico.on')?.classList.remove('on');
  }
});
document.addEventListener('click', e => {
  const pick = e.target.closest('[data-pick]');
  if (pick && menuCtx) { const cb = menuCtx.cb; closeMenu(); cb(pick.dataset.pick); return; }
  const sim = e.target.closest('[data-sim]');
  if (sim) return simAct(sim.dataset.sim);
  const el = e.target.closest('[data-act]');
  if (!el || !scr().contains(el)) return;
  const act = el.dataset.act, d = el.dataset;
  if (act === 'route-menu' || act === 'alt-menu' || act === 'set-pop' || act === 'conn-filter' || act === 'set-route-new') {
    e.stopPropagation();
    if (menuCtx && menuCtx.anchor === el) return closeMenu();
  }
  switch (act) {
    case 'route-menu': { const a = appById(d.app); openMenu(el, routeMenuItems(), ruleRoute(a), k => setRoute(a.id, k)); break; }
    case 'alt-menu': { const a = appById(d.app); const cur = a.rule.fb.slice(4); openMenu(el, routeMenuItems({realOnly:true, exclude:a.rule.route}), cur, k => { a.rule.fb = 'alt:' + k; render(); }); break; }
    case 'set-route-new': openMenu(el, routeMenuItems(), S.settings.newRoute, k => { S.settings.newRoute = k; render(); }); break;
    case 'set-pop': { const opts = JSON.parse(d.opts); openMenu(el, opts.map(([k, l]) => ({key:k, label:l, noIcon:true})), S.settings[d.k], k => { S.settings[d.k] = k; render(); }); break; }
    case 'conn-filter': { const opts = [['all','Все маршруты'],['direct','Напрямую'],...S.vpnOrder.map(id => [id, S.routes[id].name]),['block','Заблокированные']];
      openMenu(el, opts.map(([k, l]) => ({key:k, label:l, noIcon: k === 'all'})), S.connFilter, k => { S.connFilter = k; render(); }); break; }
    case 'select': if (!e.target.closest('.popup')) { S.selected = d.app; render(); } break;
    case 'fb': { const a = appById(d.app); if (['default','block'].includes(ruleRoute(a))) break;
      if (!a.rule) a.rule = {route:'default', fb:'default'};
      if (d.v === 'alt') { if (!a.rule.fb.startsWith('alt:')) { const alt = ['direct', ...S.vpnOrder].find(id => id !== a.rule.route && routeUp(S.routes[id])) || 'direct'; a.rule.fb = 'alt:' + alt; } }
      else a.rule.fb = d.v;
      render(); break; }
    case 'rule-reset': { const a = appById(d.app); a.rule = null; refreshApp(a.id); render(); break; }
    case 'abort-app': e.stopPropagation(); { const n = abortConns(c => c.app === d.app); const a = appById(d.app); if (a.running) spawnConn(a); toast(n ? `Оборвано соединений: ${n}` : 'Нет активных соединений'); } break;
    case 'view': S.view = d.v; render(); break;
    case 'stats-period': S.statsPeriod = d.p; render(); break;
    case 'view-routes': S.view = 'routes'; render(); break;
    case 'filter': S.filter = d.v; render(); break;
    case 'group': S.grouped = !S.grouped; render(); break;
    case 'pause': S.paused = !S.paused; render(); break;
    case 'collapse': if (!e.target.closest('button')) { S.collapsed[d.app] = !S.collapsed[d.app]; renderLive(); } break;
    case 'check': checkRoute(d.r); break;
    case 'check-all': ['direct', ...S.vpnOrder].forEach(checkRoute); break;
    case 'rename': S.renaming = d.r; render(); break;
    case 'diag': runDiag(); break;
    case 'toggle-enabled': S.enabled = !S.enabled; APPS.filter(a => a.running).forEach(a => abortConns(c => c.app === a.id)); render(); break;
    case 'popover': S.popover = !S.popover; render(); break;
    case 'open-main': S.mainOpen = true; S.popover = false; render(); break;
    case 'close-main': S.mainOpen = false; render(); break;
    case 'open-settings': S.setOpen = true; S.popover = false; if (d.tab) S.setTab = d.tab; render(); break;
    case 'close-settings': S.setOpen = false; S.confirm = null; render(); break;
    case 'set-tab': S.setTab = d.v; render(); break;
    case 'set-toggle': S.settings[d.k] = !S.settings[d.k]; render(); break;
    case 'set-val': S.settings[d.k] = d.v; render(); break;
    case 'set-dns': S.setOpen = true; S.setTab = 'dns'; render(); break;
    case 'set-ks': S.setOpen = true; S.setTab = 'ks'; render(); break;
    case 'sys-ext': S.sys = 'ext'; render(); break;
    case 'close-sys': S.sys = null; if (S.onboarding) { const i = S.onboarding.st.indexOf('waiting'); if (i >= 0) S.onboarding.st[i] = 'pending'; } render(); break;
    case 'sys-on': el.classList.add('on'); setTimeout(() => {
        if (S.onboarding) onbComplete(S.sys === 'helper' ? 2 : 0);
        else { S.ext = true; S.sys = null; toast('Сетевое расширение включено'); render(); }
      }, 450); break;
    case 'alert-yes': onbComplete(1); break;
    case 'alert-no': S.alert = null; S.onboarding.st[1] = 'error'; render(); break;
    case 'onb-step': { const i = +d.i; S.onboarding.st[i] = 'waiting'; if (i === 1) S.alert = true; else S.sys = i === 0 ? 'ext' : 'helper'; render(); break; }
    case 'onb-retry': S.onboarding.st[+d.i] = 'pending'; render(); break;
    case 'onb-finish': S.onboarding = null; S.ext = true; S.enabled = true; S.view = 'apps'; render(); break;
    case 'reset-rules': APPS.forEach(a => a.rule = null); toast('Правила сброшены'); render(); break;
    case 'uninstall': S.confirm = true; render(); break;
    case 'uninstall-no': S.confirm = null; render(); break;
    case 'uninstall-yes': S.confirm = null; S.setOpen = false; startOnboarding(); toast('SplitPipe удалён — запущен заново'); break;
    case 'quit': S.popover = false; toast('В прототипе выход отключён'); break;
    case 'toast': toast(d.msg); break;
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { S.search = e.target.value; document.getElementById('applist').innerHTML = renderAppsList(); }
  else if (e.target.dataset.k && e.target.classList.contains('textin')) S.settings[e.target.dataset.k] = e.target.value;
});
document.addEventListener('change', e => {
  const s = e.target.dataset.simSel;
  if (s === 'fg') { S.foreground = e.target.value; render(); }
  if (s === 'err') { S.onbErrStep = +e.target.value; render(); }
});
document.addEventListener('keydown', e => {
  if (e.target.id === 'rename') {
    if (e.key === 'Enter') { const v = e.target.value.trim(); if (v) S.routes[S.renaming].name = v; S.renaming = null; render(); }
    if (e.key === 'Escape') { S.renaming = null; render(); }
  }
  if (e.key === 'Escape') { closeMenu(); if (S.popover) { S.popover = false; render(); } }
});
document.addEventListener('focusout', e => {
  if (e.target.id === 'rename' && S.renaming) { const v = e.target.value.trim(); if (v) S.routes[S.renaming].name = v; S.renaming = null; setTimeout(render); }
});
function checkRoute(id){
  S.checks[id] = {state:'run'}; render();
  setTimeout(() => {
    const r = S.routes[id];
    S.checks[id] = routeUp(r) ? {state:'ok', ip: id === 'direct' ? '203.0.113.10' : r.ext, ms: rnd(20, 95), at: Date.now()} : {state:'fail', at: Date.now()};
    if (S.view === 'routes') render();
  }, rnd(700, 1400));
}
function startOnboarding(){
  S.onboarding = {st:['pending','pending','pending']};
  S.ext = false; S.mainOpen = true; S.popover = false; S.sys = null; S.alert = null;
  render();
}
const INITIAL = JSON.stringify({routes:S.routes, rules:APPS.map(a => a.rule), settings:S.settings});
function simAct(k){
  if (k === 'min') { S.simMin = !S.simMin; renderSim(); setTimeout(fit); return; }
  if (k.startsWith('vpn:')) { const id = k.slice(4); setVpn(id, !S.routes[id].up); return; }
  if (k.startsWith('phys:')) { const v = k.slice(5); if (direct().phys !== v) { direct().phys = v; abortConns(() => true); if (v === 'none') notify('Нет сети', 'Все маршруты недоступны'); APPS.filter(a => a.running).forEach(spawnConn); } render(); return; }
  if (k.startsWith('theme:')) { S.theme = k.slice(6); render(); return; }
  if (k === 'aks') S.amneziaKS = !S.amneziaKS;
  if (k === 'ext') { S.ext = !S.ext; if (!S.ext) notify('Сетевое расширение выключено', 'SplitPipe не управляет трафиком'); }
  if (k === 'onb') { startOnboarding(); return; }
  if (k === 'reset') APPS.forEach(a => a.rule = null);
  if (k === 'restore') { const o = JSON.parse(INITIAL); S.routes = o.routes; APPS.forEach((a, i) => a.rule = o.rules[i]); S.settings = o.settings; S.onboarding = null; S.ext = true; S.enabled = true; S.diag = null; S.checks = {}; }
  render();
}

/* window dragging */
let drag = null;
document.addEventListener('pointerdown', e => {
  const h = e.target.closest('[data-drag]');
  if (!h || e.target.closest('button,input,.popup,[data-act]:not([data-drag]),.lights')) return;
  const k = document.getElementById('screen').getBoundingClientRect().width / 1280;
  const w = S.win[h.dataset.drag];
  drag = {w, sx:e.clientX, sy:e.clientY, ox:w.x, oy:w.y, k, el:h.closest('.win')};
});
document.addEventListener('pointermove', e => {
  if (!drag) return;
  drag.w.x = Math.round(drag.ox + (e.clientX - drag.sx) / drag.k);
  drag.w.y = Math.max(26, Math.round(drag.oy + (e.clientY - drag.sy) / drag.k));
  drag.el.style.left = drag.w.x + 'px'; drag.el.style.top = drag.w.y + 'px';
});
document.addEventListener('pointerup', () => drag = null);

/* init: #theme=light&view=routes&popover=1&settings=ks&onb=1&off=work,amnezia&ks=always */
const H = new URLSearchParams(location.hash.slice(1));
if (H.get('theme')) S.theme = H.get('theme');
if (H.get('view')) S.view = H.get('view');
if (H.get('ks')) S.settings.ksMode = H.get('ks');
(H.get('off') || '').split(',').filter(Boolean).forEach(id => S.routes[id] && (S.routes[id].up = false));
if (H.get('popover')) S.popover = true;
if (H.get('settings')) { S.setOpen = true; S.setTab = H.get('settings'); }
if (H.get('onb')) S.onboarding = {st:['done','pending','pending'].slice(0, 3).map((x, i) => i < +H.get('onb') ? 'done' : 'pending')};
if (H.get('dns')) S.settings.dns = H.get('dns');

APPS.filter(a => a.running).forEach(a => { spawnConn(a); spawnConn(a); });
S.conns.forEach(c => { c.fresh = false; c.t = new Date(Date.now() - rnd(1000, 60000)); });
S.conns.sort((a, b) => b.t - a.t);
window.addEventListener('resize', fit);
render(); fit();
if (H.get('diag')) { S.view = 'diag'; runDiag(); }
setInterval(tick, 1300);
setInterval(() => { const c = document.querySelector('.menubar .clock'); if (c) { const n = new Date(); c.textContent = c.textContent.replace(/\d\d:\d\d$/, n.toTimeString().slice(0,5)); } }, 15000);
</script>
</body>
