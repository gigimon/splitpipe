name: SplitPipe
options:
  bundleIdPrefix: dev.splitpipe
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: ru
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0
settings:
  base:
    DEVELOPMENT_TEAM: BL65NHTRYD
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    EXTENSION_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
  # Debug is the development variant ("SplitPipe Dev", dev.splitpipe.*, automatic signing), Release is the product
  # (SplitPipe, tech.splitpipe.*, Developer ID with the "Splitpipe production" profiles). Both install side by side.
  configs:
    Debug:
      SP_DISPLAY_NAME: SplitPipe Dev
      SP_APP_ID: dev.splitpipe.app
      SP_PROXY_ID: dev.splitpipe.app.proxy
      SP_WIDGETS_ID: dev.splitpipe.app.widgets
      SP_HELPER_ID: dev.splitpipe.helper
      SP_GROUP: dev.splitpipe
      SP_NE_APP_PROXY: app-proxy-provider
    Release:
      SP_DISPLAY_NAME: SplitPipe
      SP_APP_ID: tech.splitpipe
      SP_PROXY_ID: tech.splitpipe.proxy
      SP_WIDGETS_ID: tech.splitpipe.widgets
      SP_HELPER_ID: tech.splitpipe.helper
      SP_GROUP: tech.splitpipe
      SP_NE_APP_PROXY: app-proxy-provider-systemextension
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: Developer ID Application
targets:
  SplitPipe:
    type: application
    platform: macOS
    sources:
      - SplitPipe
      - Shared
      - path: Widgets/WidgetState.swift
    info:
      path: SplitPipe/Info.plist
      properties:
        CFBundleDisplayName: $(SP_DISPLAY_NAME)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ru]
        CFBundlePackageType: APPL
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        SPAppGroup: $(TeamIdentifierPrefix)$(SP_GROUP)
        CFBundleURLTypes:
          - CFBundleURLName: $(SP_APP_ID)
            CFBundleURLSchemes: [splitpipe]
    scheme: {}
    entitlements:
      path: SplitPipe/SplitPipe.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - $(SP_NE_APP_PROXY)
        com.apple.developer.system-extension.install: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)$(SP_GROUP)
    settings:
      base:
        PRODUCT_NAME: $(SP_DISPLAY_NAME)
        PRODUCT_MODULE_NAME: SplitPipe
        PRODUCT_BUNDLE_IDENTIFIER: $(SP_APP_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
      configs:
        Release:
          PROVISIONING_PROFILE_SPECIFIER: Splitpipe production
    # The extension and the helper are named by their bundle ids, which differ per variant. Xcode resolves the names
    # of embedded products with the default (Debug) configuration, so they are copied here by their real names, before
    # the app is signed; the export for Developer ID re-signs them. The helper's launchd plist is written the same way.
    postBuildScripts:
      - name: Embed extension, helper and launchd plist
        basedOnDependencyAnalysis: false
        script: |
          set -e
          contents="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH"
          mkdir -p "$contents/Library/SystemExtensions" "$contents/Library/LaunchDaemons" "$contents/MacOS"
          rm -rf "$contents/Library/SystemExtensions/$SP_PROXY_ID.systemextension"
          ditto "$BUILT_PRODUCTS_DIR/$SP_PROXY_ID.systemextension" "$contents/Library/SystemExtensions/$SP_PROXY_ID.systemextension"
          ditto "$BUILT_PRODUCTS_DIR/$SP_HELPER_ID" "$contents/MacOS/$SP_HELPER_ID"
          sed -e "s/__HELPER_ID__/$SP_HELPER_ID/g" -e "s/__APP_ID__/$SP_APP_ID/g" "$SRCROOT/Launchd/helper.plist" > "$contents/Library/LaunchDaemons/$SP_HELPER_ID.plist"
    dependencies:
      - package: KeyboardShortcuts
      - target: SplitPipeWidgets
        embed: true
      - target: SplitPipeProxy
        embed: false
      - target: SplitPipeHelper
        embed: false
  SplitPipeWidgets:
    type: app-extension
    platform: macOS
    sources:
      - Widgets
      - path: SplitPipe/Localizable.xcstrings
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: $(SP_DISPLAY_NAME)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        SPAppGroup: $(TeamIdentifierPrefix)$(SP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/SplitPipeWidgets.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)$(SP_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SP_WIDGETS_ID)
        SKIP_INSTALL: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
  SplitPipeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - Shared
      # Pure app logic without `AppModel`.
      - path: SplitPipe/EventLog.swift
      - path: SplitPipe/URLCommand.swift
      - path: SplitPipe/TemporaryRouteTypes.swift
      - path: SplitPipeProxy/UDPSockets.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.splitpipe.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
    scheme:
      testTargets:
        - SplitPipeTests
  SplitPipeHelper:
    type: tool
    platform: macOS
    sources:
      - SplitPipeHelper
      - Shared
    settings:
      base:
        PRODUCT_NAME: $(SP_HELPER_ID)
        PRODUCT_BUNDLE_IDENTIFIER: $(SP_HELPER_ID)
        INFOPLIST_FILE: SplitPipeHelper/Info.plist
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        SKIP_INSTALL: YES
  SplitPipeProxy:
    type: system-extension
    platform: macOS
    sources:
      - SplitPipeProxy
      - Shared
    info:
      path: SplitPipeProxy/Info.plist
      properties:
        CFBundleDisplayName: SplitPipe Proxy
        CFBundlePackageType: SYSX
        CFBundleVersion: $(EXTENSION_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSSystemExtensionUsageDescription: Routes selected applications through chosen network interfaces.
        SPAppGroup: $(TeamIdentifierPrefix)$(SP_GROUP)
        NetworkExtension:
          NEMachServiceName: $(TeamIdentifierPrefix)$(SP_GROUP).proxy
          NEProviderClasses:
            com.apple.networkextension.app-proxy: $(PRODUCT_MODULE_NAME).TransparentProxyProvider
    entitlements:
      path: SplitPipeProxy/SplitPipeProxy.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - $(SP_NE_APP_PROXY)
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)$(SP_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SP_PROXY_ID)
        PRODUCT_NAME: $(SP_PROXY_ID)
        SKIP_INSTALL: YES
      configs:
        Release:
          PROVISIONING_PROFILE_SPECIFIER: Splitpipe proxy production
